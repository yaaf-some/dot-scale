<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff1ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d1713">
<title>Dot Scale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dot Scale">
<link rel="stylesheet" href="app/ui/tokens.css">
<link rel="stylesheet" href="app/ui/app.css">
</head>
<body>
<div id="shell" class="shell" data-chrome="tabs">
  <nav id="tabs" class="tabs" aria-label="Main"></nav>
  <main id="view" class="view-host" tabindex="-1"></main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Dot Scale needs JavaScript.</p></noscript>
<script type="module" src="app/main.js"></script>
</body>
</html>
